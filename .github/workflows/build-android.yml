name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versiones
        run: flutter --version

      - name: Completar proyecto Android
        run: bash tool/prepare_android.sh

      - name: Dependencias
        run: flutter pub get

      - name: Validar contenido (Python)
        run: |
          python3 tool/verify_dart.py
          python3 tool/content/build.py
          python3 tool/generate_demo.py
          git diff --exit-code -- assets/ || (echo "Los JSON no coinciden con sus generadores" && exit 1)

      - name: Análisis
        run: flutter analyze --no-fatal-infos

      - name: Pruebas
        run: flutter test

      - name: Firma release propia (opcional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash tool/apply_release_signing.sh

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Comprobar permisos del APK
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -n1)
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee permisos.txt
          if grep -q "android.permission.INTERNET" permisos.txt; then echo "El APK release no debe pedir INTERNET"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: enves-apk
          path: build/app/outputs/flutter-apk/app-release.apk
